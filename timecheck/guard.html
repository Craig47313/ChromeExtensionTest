<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hold up</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="guard.css">
</head>
<body class="guard-body">
  <main class="g-card">
    <div class="g-site" id="site"></div>
    <h1 id="headline">Hold up.</h1>
    <p class="g-why" id="why"></p>

    <section class="g-box" id="focusBox" hidden>
      <div class="g-label">You’re in a focus block</div>
      <div class="g-focus-title" id="focusTitle"></div>
      <div class="g-focus-left" id="focusLeft"></div>
      <div class="g-allowed" id="allowedBox" hidden>
        <div class="g-label">Allowed for this block</div>
        <ul class="g-list" id="allowedList"></ul>
      </div>
    </section>

    <section class="g-box" id="dueBox" hidden>
      <div class="g-label">Still to do</div>
      <ol class="g-list" id="dueList"></ol>
    </section>

    <section class="g-box idea" id="ideaBox" hidden>
      <div class="g-label">Nothing due? Try this instead</div>
      <div id="idea"></div>
    </section>

    <div class="g-actions">
      <button class="btn primary big" id="backBtn">Back to work</button>
      <button class="btn big" id="focusBtn" hidden>Start a focus block</button>
    </div>

    <details class="g-pass" id="passBox">
      <summary id="passSummary">I really need this site</summary>
      <div class="g-pass-body">
        <label for="reason">Why? Be specific — this goes in your log.</label>
        <textarea id="reason" rows="2" placeholder="e.g. watching the Khan Academy video on Gibbs free energy for chem"></textarea>
        <div id="sentenceWrap" hidden>
          <label for="sentence">You’re in a focus block. Type this exactly:</label>
          <div class="g-sentence" id="sentenceText"></div>
          <textarea id="sentence" rows="2" spellcheck="false" autocomplete="off"></textarea>
        </div>
        <div class="g-mins" id="mins"></div>
        <label class="g-check" id="allowWrap" hidden><input type="checkbox" id="allowPage"> <span>Keep this page allowed for the rest of this block</span></label>
        <button class="btn danger" id="passBtn" disabled>Let me in</button>
        <div class="g-count" id="count"></div>
      </div>
    </details>
    <details class="g-pass g-off" id="offBox" hidden>
      <summary>I have my off-switch code</summary>
      <div class="g-pass-body">
        <label for="offCode">Code</label>
        <input id="offCode" type="password" inputmode="numeric" maxlength="6" autocomplete="off">
        <div class="g-mins" id="offChoices"></div>
        <div class="g-count" id="offMsg" role="status"></div>
      </div>
    </details>
    <div class="g-today" id="todayStats"></div>
  </main>

  <script src="lib/icons.js"></script>
  <script src="lib/palettes.js"></script>
  <script src="lib/dates.js"></script>
  <script src="lib/planner.js"></script>
  <script src="guard.js"></script>
</body>
</html>
